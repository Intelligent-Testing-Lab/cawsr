log:
  path: 'logs/'
carla:
  host: 127.0.0.1
  fidelity: 'High'
  port: 2000
  timeout: 20
  sync: true
  fixed_delta_seconds: 0.05 # update rate 1 / FPS
  use_tm: true
  tm_seed: 0
  tm_port: 8001
  follow_ego: true # camera
scenario_runner:
  debug: false
  mode: algorithm # benchmark or algorithm

  json: ./example_scenario.json
  agent: srunner/autoagents/autoware_agent # never change
  route_initialisation_budget: 500 # ticks

  algorithm:
    iterations: 50
    path: algorithms/random_search
    seed: 10

    args: # passed into algorithm, key-pair
      lanelet2: /autoware_scenario_runner/algorithms/resources/Town01.osm
