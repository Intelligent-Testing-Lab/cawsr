name: Build and publish docker image

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.USER_NAME }} # username
          password: ${{ secrets.CR_PAT }} # PAT for CR repository
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/intelligent-testing-lab/autoware-scenario-runner:latest
          cache-from: type=registry,ref=ghcr.io/intelligent-testing-lab/autoware-scenario-runner:buildcache
          cache-to: type=registry,ref=ghcr.io/intelligent-testing-lab/autoware-scenario-runner:buildcache,mode=max
        